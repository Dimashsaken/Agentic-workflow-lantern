# Codex CLI on Azure OpenAI — copy into ~/.codex/config.toml, or keep it as an opt-in
# profile (`[profiles.azure]`, run `codex --profile azure`) and fill in.
#
# The developer's coding session IS the builder tier of the model stack (D16/D26):
# gpt-5.6-terra, the mid size of GPT-5.6. Reach for gpt-5.6-sol — the frontier size,
# 2.5x the price — only for planning-heavy sessions. Whatever you name here must be
# DEPLOYED on the resource first (tools/azure-runner/README.md "Model stack";
# `smoke_test.py <name>` says). Known issue as of Codex 0.149 (Aug 2026): gpt-5.6-*
# names sent to Azure with the responses-lite / multi-agent flags come back 400
# (openai/codex #31870); the workaround is a custom `model_catalog_json` —
# docs/plans/symphony-alignment.md. Verify on your version before relying on it.

model = "gpt-5.6-terra"            # the coding tier — an Azure *deployment* name
model_reasoning_effort = "high"    # the tier's default effort; "xhigh" for the hardest tasks
model_provider = "azure"

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://YOUR-RESOURCE.openai.azure.com/openai/v1"   # v1 surface: no api-version needed
env_key = "AZURE_OPENAI_API_KEY"   # Codex reads the key from this env var
wire_api = "responses"             # Chat Completions was removed from Codex in Feb 2026

# Mirror the shared MCP servers from .mcp.json (repo root) that the coding stage needs:
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

# Design workstation only (Phase-1 interactive ui-ux sessions): Paper Desktop must be
# running with the Lantern file open, or Codex will report the server as unreachable.
# [mcp_servers.paper]
# url = "http://127.0.0.1:29979/mcp"
