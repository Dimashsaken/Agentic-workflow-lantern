# Lantern's own quality gate — used when the product under a run IS this repository
# (dogfood runs). The coding stage's gate (tools/azure-runner/factory.py) runs these
# from the repo root with $LANTERN_PYTHON = the interpreter running the harness, which
# carries this repo's dependencies both in the sandbox (/opt/lantern/venv) and on a
# laptop (tools/azure-runner/.venv). Only failures go back to the coding agent.

[quality]
test = "$LANTERN_PYTHON tools/azure-runner/test_model_stack.py && $LANTERN_PYTHON tools/azure-runner/test_qa_target.py && $LANTERN_PYTHON tools/azure-runner/test_brief_parsing.py && $LANTERN_PYTHON infra/ec2/test_tender_qa_account.py && $LANTERN_PYTHON tools/azure-runner/test_qa_login_probe.py && $LANTERN_PYTHON tools/azure-runner/test_design_mode.py && $LANTERN_PYTHON tools/azure-runner/test_factory.py && $LANTERN_PYTHON tools/azure-runner/test_builders.py && $LANTERN_PYTHON tools/azure-runner/test_coding_stage.py && $LANTERN_PYTHON tools/azure-runner/test_review.py && $LANTERN_PYTHON tools/azure-runner/test_chat_tools.py && $LANTERN_PYTHON tools/azure-runner/test_init_product.py && $LANTERN_PYTHON tools/slack-bridge/test_bridge.py && $LANTERN_PYTHON tools/azure-runner/test_intake.py && $LANTERN_PYTHON tools/azure-runner/test_product_access.py && $LANTERN_PYTHON tools/azure-runner/test_tool_policy.py && $LANTERN_PYTHON tools/azure-runner/test_gate_integrity.py && $LANTERN_PYTHON tools/azure-runner/test_evidence.py && $LANTERN_PYTHON tools/azure-runner/test_execution_journal.py && $LANTERN_PYTHON tools/azure-runner/test_execution_leases.py && $LANTERN_PYTHON tools/azure-runner/test_execution_runtime.py && $LANTERN_PYTHON tools/azure-runner/test_github_publication.py && $LANTERN_PYTHON tools/azure-runner/test_recovery_acceptance.py && $LANTERN_PYTHON tools/azure-runner/test_durable_execution.py && $LANTERN_PYTHON tools/azure-runner/test_isolated_tools.py && $LANTERN_PYTHON tools/azure-runner/test_tool_execution.py && $LANTERN_PYTHON tools/azure-runner/test_evidence_manifest.py && $LANTERN_PYTHON tools/azure-runner/test_trusted_evidence.py && $LANTERN_PYTHON tools/azure-runner/test_trace.py && $LANTERN_PYTHON tools/mission-control/test_traceability.py && $LANTERN_PYTHON tools/mission-control/test_drawer.py && $LANTERN_PYTHON tools/evals/test_evals.py && $LANTERN_PYTHON -m unittest discover -q -s tools/azure-runner -p test_status_json.py && $LANTERN_PYTHON -m unittest discover -q -s tools/mission-control -p test_gate_latency.py && $LANTERN_PYTHON -m unittest discover -q -s lantern/regressions -p 'test_*.py'"
# D20: lint also runs the eval rule — a diff touching agents/**, factory.py, intake.py or the
# orchestrator's prompt builders/gate functions must ship a regenerated tools/evals/REPORT.md.
lint = "$LANTERN_PYTHON -m compileall -q tools/azure-runner tools/mission-control tools/evals && $LANTERN_PYTHON tools/evals/check_pr.py"
timeout_s = 900
